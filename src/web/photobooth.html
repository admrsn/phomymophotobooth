<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Phomymo Photobooth</title>
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        const errorBox = document.createElement('div');
        errorBox.style.cssText = 'position:absolute; top:10%; left:5%; right:5%; background:#dc2626; color:white; padding:20px; z-index:9999; word-wrap:break-word; font-size:18px; border-radius:12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);';
        errorBox.innerHTML = '<strong>CRASH REPORT:</strong><br><br>' + message + '<br><br><strong>Line:</strong> ' + lineno;
        if (document.body) {
            document.body.appendChild(errorBox);
        } else {
            window.addEventListener('DOMContentLoaded', () => document.body.appendChild(errorBox));
        }
        return true;
    };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .photobooth-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top video preview area filling screen height */
        .video-preview-area {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror front camera */
        }

        /* 2:3 Print Bounding Box Overlay */
        .viewfinder-overlay {
            position: absolute;
            width: min(82%, 360px);
            aspect-ratio: 2 / 3;
            border: 2px dashed rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); /* Darkens everything outside print ratio */
            pointer-events: none;
            z-index: 5;
        }

        /* Reliable Camera Flash Animation Overlay */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }
        .flash-overlay.flash {
            animation: camera-flash 0.25s ease-out;
        }
        @keyframes camera-flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Dedicated bottom control panel in the non-printed blank space */
        .control-panel {
            height: 110px;
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 20px;
            z-index: 20;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #start-button {
            flex: 1;
            max-width: 280px;
            height: 60px;
            font-size: 22px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        #start-button:active {
            transform: scale(0.97);
        }

        #start-button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }

        #connect-printer-btn {
            height: 60px;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 600;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        #connect-printer-btn:active {
            transform: scale(0.97);
        }

        /* Utility class to hide elements securely */
        .hidden {
            display: none !important;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #9ca3af;
            display: inline-block;
        }

        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-display {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            z-index: 30;
            background-color: rgba(17, 24, 39, 0.85);
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
            pointer-events: none;
        }

        .status-display.visible {
            display: block;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            z-index: 25;
            display: none;
            pointer-events: none;
            animation: pulse-scale 1s ease-out infinite;
        }

        .countdown.visible {
            display: block;
        }

        @keyframes pulse-scale {
            0% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <div class="photobooth-container">
        <!-- Full-screen video preview background with 2:3 print crop box overlay -->
        <div class="video-preview-area">
            <video id="camera-feed" playsinline autoplay muted></video>
            <div class="viewfinder-overlay"></div>
            <div id="flash-overlay" class="flash-overlay"></div>

            <div class="status-display" id="status-display"></div>
            <div class="countdown" id="countdown"></div>
        </div>

        <!-- Buttons safely housed below in the non-printed space -->
        <div class="control-panel">
            <button id="connect-printer-btn">
                <span id="status-dot" class="status-dot"></span>
                <span id="connect-btn-text">Connect Printer</span>
            </button>
            <button id="start-button">START</button>
        </div>
    </div>

    <canvas id="composite-canvas" style="display: none;"></canvas>

    <script type="module">
        import { BLETransport } from './ble.js';
        import { print } from './printer.js';
        import { PhotoboothApp } from './photobooth.js';

        const app = new PhotoboothApp({
            videoElementId: 'camera-feed',
            startButtonId: 'start-button',
            connectButtonId: 'connect-printer-btn',
            statusButtonTextId: 'connect-btn-text',
            statusDotId: 'status-dot',
            countdownElementId: 'countdown',
            statusDisplayId: 'status-display',
            flashElementId: 'flash-overlay',
            compositeCanvasId: 'composite-canvas'
        });

        window.photoboothApp = app;
    </script>
</body>
</html>
