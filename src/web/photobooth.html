<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Phomymo Photobooth</title>
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        const errorBox = document.createElement('div');
        errorBox.style.cssText = 'position:absolute; top:10%; left:5%; right:5%; background:#dc2626; color:white; padding:20px; z-index:9999; word-wrap:break-word; font-size:18px; border-radius:12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);';
        errorBox.innerHTML = '<strong>CRASH REPORT:</strong><br><br>' + message + '<br><br><strong>Line:</strong> ' + lineno;
        if (document.body) {
            document.body.appendChild(errorBox);
        } else {
            window.addEventListener('DOMContentLoaded', () => document.body.appendChild(errorBox));
        }
        return true;
    };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .photobooth-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }

        .video-container {
            flex: 1;
            width: 100%;
            max-width: 480px; /* Constrain width to roughly match 2:3 framing */
            max-height: 72vh;
            aspect-ratio: 2 / 3; /* Enforce 2:3 aspect ratio preview */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Camera Flash Overlay */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.08s ease-out;
        }
        .flash-overlay.flash {
            opacity: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
            padding: 30px 20px;
            z-index: 10;
        }

        .button-area {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        #start-button {
            min-width: 150px;
            padding: 16px 36px;
            font-size: 22px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #start-button:active {
            transform: scale(0.95);
        }

        #start-button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #connect-printer-btn {
            padding: 16px 16px;
            font-size: 15px;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.9);
            color: #1f2937;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            touch-action: manipulation;
        }

        #connect-printer-btn:active {
            transform: scale(0.95);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #9ca3af;
            display: inline-block;
        }

        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-display {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            color: white;
            font-size: 15px;
            text-align: center;
            z-index: 20;
            pointer-events: auto;
            display: none;
            background-color: rgba(0, 0, 0, 0.85);
        }

        .status-display.visible {
            display: block;
        }

        .countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 110px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 4px 4px 12px rgba(0, 0, 0, 0.8);
            z-index: 15;
            display: none;
            pointer-events: none;
            animation: pulse-scale 1s ease-out;
        }

        .countdown.visible {
            display: block;
        }

        @keyframes pulse-scale {
            0% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
        }
    </style>
</head>
<body>
    <div class="photobooth-container">
        <div class="video-container">
            <video id="camera-feed" playsinline autoplay muted></video>
            <div id="flash-overlay" class="flash-overlay"></div>

            <div class="ui-layer">
                <div class="status-display" id="status-display"></div>
                <div class="countdown" id="countdown"></div>
                <div class="button-area">
                    <button id="connect-printer-btn">
                        <span id="status-dot" class="status-dot"></span>
                        <span id="connect-btn-text">Connect</span>
                    </button>
                    <button id="start-button">START</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="composite-canvas" style="display: none;"></canvas>

    <script type="module">
        import { BLETransport } from './ble.js';
        import { print } from './printer.js';
        import { PhotoboothApp } from './photobooth.js';

        const app = new PhotoboothApp({
            videoElementId: 'camera-feed',
            startButtonId: 'start-button',
            connectButtonId: 'connect-printer-btn',
            statusButtonTextId: 'connect-btn-text',
            statusDotId: 'status-dot',
            countdownElementId: 'countdown',
            statusDisplayId: 'status-display',
            flashElementId: 'flash-overlay',
            compositeCanvasId: 'composite-canvas'
        });

        window.photoboothApp = app;
    </script>
</body>
</html>
