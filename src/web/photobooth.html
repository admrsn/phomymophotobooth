<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Phomymo Photobooth</title>
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        const errorBox = document.createElement('div');
        errorBox.style.cssText = 'position:absolute; top:10%; left:5%; right:5%; background:#dc2626; color:white; padding:20px; z-index:9999; word-wrap:break-word; font-size:18px; border-radius:12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);';
        errorBox.innerHTML = '<strong>CRASH REPORT:</strong><br><br>' + message + '<br><br><strong>Line:</strong> ' + lineno;
        if (document.body) {
            document.body.appendChild(errorBox);
        } else {
            window.addEventListener('DOMContentLoaded', () => document.body.appendChild(errorBox));
        }
        return true;
    };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .photobooth-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        #camera-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Viewfinder framing box matching 2:3 print aspect ratio precisely */
        .viewfinder-overlay {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(78%, 340px);
            aspect-ratio: 2 / 3;
            border: 2px dashed rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 5;
        }

        /* Camera Flash Animation Overlay */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }
        .flash-overlay.flash {
            animation: camera-flash 0.25s ease-out;
        }
        @keyframes camera-flash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* UI Layer overlaying the full screen video */
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            pointer-events: none;
            padding: 30px 20px 45px 20px;
            z-index: 20;
        }

        .button-area {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        #start-button {
            flex: 1;
            height: 56px;
            font-size: 20px;
            font-weight: bold;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.5);
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        #start-button:active {
            transform: scale(0.97);
        }

        #start-button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
            box-shadow: none;
        }

        #connect-printer-btn {
            height: 56px;
            padding: 0 18px;
            font-size: 14px;
            font-weight: 600;
            background-color: rgba(17, 24, 39, 0.85);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        #connect-printer-btn:active {
            transform: scale(0.97);
        }

        .hidden {
            display: none !important;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: #9ca3af;
            display: inline-block;
        }

        .status-dot.connected {
            background-color: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        .status-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            background-color: rgba(17, 24, 39, 0.85);
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
            pointer-events: none;
            z-index: 30;
        }

        .status-display.visible {
            display: block;
        }

        .countdown {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 110px;
            font-weight: bold;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            z-index: 25;
            display: none;
            pointer-events: none;
        }

        .countdown.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="photobooth-container">
        <video id="camera-feed" playsinline autoplay muted></video>
        <div class="viewfinder-overlay"></div>
        <div id="flash-overlay" class="flash-overlay"></div>

        <div class="status-display" id="status-display"></div>
        <div class="countdown" id="countdown"></div>

        <div class="ui-layer">
            <div class="button-area">
                <button id="connect-printer-btn">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="connect-btn-text">Connect Printer</span>
                </button>
                <button id="start-button">START</button>
            </div>
        </div>
    </div>

    <canvas id="composite-canvas" style="display: none;"></canvas>

    <script type="module">
        import { BLETransport } from './ble.js';
        import { print } from './printer.js';
        import { PhotoboothApp } from './photobooth.js';

        const app = new PhotoboothApp({
            videoElementId: 'camera-feed',
            startButtonId: 'start-button',
            connectButtonId: 'connect-printer-btn',
            statusButtonTextId: 'connect-btn-text',
            statusDotId: 'status-dot',
            countdownElementId: 'countdown',
            statusDisplayId: 'status-display',
            flashElementId: 'flash-overlay',
            compositeCanvasId: 'composite-canvas'
        });

        window.photoboothApp = app;
    </script>
</body>
</html>
